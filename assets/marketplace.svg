<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Marketplace flows">
  <rect width="1200" height="420" rx="28" fill="#0b1220"/>
  <text x="48" y="48" fill="#f3f6fb" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700">Marketplace</text>
  <text x="48" y="72" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500">signup left / metering right</text>

  <text x="48" y="114" fill="#d7ff3f" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">SIGNUP</text>
  <rect x="48" y="128" width="520" height="240" rx="22" fill="#131c2c" stroke="#2b3b54"/>
  <g fill="#edf2fa" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
    <text x="72" y="168">1  Subscribe on AWS</text>
    <text x="72" y="196">2  Token redirect to intake-aws</text>
    <text x="72" y="224">3  ResolveCustomer + Entitlements</text>
    <text x="72" y="252">4  Account to MySQL</text>
    <text x="72" y="280">5  Setup / email / profile</text>
    <text x="72" y="308">6  ensure_user / ensure_project</text>
    <text x="72" y="336">7  Project ID written / done</text>
  </g>

  <text x="620" y="114" fill="#d7ff3f" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">METERING</text>
  <rect x="620" y="128" width="520" height="240" rx="22" fill="#131c2c" stroke="#2b3b54"/>
  <g fill="#edf2fa" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
    <text x="644" y="168">1  Use WhaleStudio</text>
    <text x="644" y="196">2  POST /usage/events</text>
    <text x="644" y="224">3  Raw events in MySQL</text>
    <text x="644" y="252">4  Hourly aggregate to Outbox</text>
    <text x="644" y="280">5  BatchMeterUsage to AWS</text>
    <text x="644" y="308">6  Outbox Success / Retry</text>
    <text x="644" y="336">7  Keep billing honest</text>
  </g>
</svg>
