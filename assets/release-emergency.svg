      <circle cx="26" cy="35" r="11" fill="#d7ff3f"/><text x="26" y="39" text-anchor="middle" fill="#1a0f12" font-size="11" font-weight="700">9</text>
      <text x="48" y="40" fill="#f4ecee" font-size="13" font-weight="600">版本 + commit</text>
    </g>
    <g transform="translate(944 200)">
      <rect width="208" height="70" rx="18" fill="url(#card2)" stroke="#5a3038"/>
      <circle cx="26" cy="35" r="11" fill="#d7ff3f"/><text x="26" y="39" text-anchor="middle" fill="#1a0f12" font-size="11" font-weight="700">10</text>
      <text x="48" y="40" fill="#f4ecee" font-size="13" font-weight="600">全员通知</text>
