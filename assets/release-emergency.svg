  <path d="M248 145 H272 M472 145 H496 M696 145 H720 M920 145 H944" stroke="#6a4450" stroke-width="2"/>
  <path d="M248 235 H272 M472 235 H496 M696 235 H720 M920 235 H944" stroke="#6a4450" stroke-width="2"/>
  <path d="M1048 180 V200" stroke="#6a4450" stroke-width="2"/>
