<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Architecture map">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#152033"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6f7f99"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#0b1220"/>
  <text x="48" y="44" fill="#f3f6fb" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700">System map</text>
  <text x="48" y="68" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500">from the edge in - one request path, clear side effects</text>

  <!-- Connectors first; boxes drawn above so strokes never cut through labels -->
  <path d="M128 188 V232" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M128 302 V352" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M198 396 H222" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M372 396 H396" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M546 396 H570" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M720 396 H744" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1013 352 V324 H471 V352" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <path d="M829 440 V468 H471 V440" stroke="#6f7f99" stroke-width="2" fill="none" marker-end="url(#arrow)" opacity="0.75"/>

  <text x="48" y="104" fill="#d7ff3f" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">EXTERNAL</text>
  <rect x="48" y="116" width="160" height="72" rx="16" fill="url(#panel)" stroke="#2a3a52"/>
  <text x="128" y="158" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">Customer</text>

  <rect x="248" y="116" width="160" height="72" rx="16" fill="url(#panel)" stroke="#2a3a52"/>
  <text x="328" y="150" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">AWS</text>
  <text x="328" y="170" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11">identity / mail infra</text>

  <rect x="448" y="116" width="160" height="72" rx="16" fill="url(#panel)" stroke="#2a3a52"/>
  <text x="528" y="150" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">Email</text>
  <text x="528" y="170" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11">outbound notify</text>

  <text x="48" y="224" fill="#d7ff3f" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">EDGE</text>
  <rect x="48" y="236" width="160" height="62" rx="16" fill="#14261f" stroke="#3ef0c8" stroke-opacity="0.5"/>
  <text x="128" y="272" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">Nginx / ALB</text>

  <text x="48" y="344" fill="#d7ff3f" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">SAAS / DATA / CORE</text>

  <rect x="48" y="352" width="150" height="88" rx="16" fill="url(#panel)" stroke="#d7ff3f" stroke-opacity="0.55"/>
  <text x="123" y="390" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">API Layer</text>
  <text x="123" y="412" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12">FastAPI</text>

  <rect x="222" y="352" width="150" height="88" rx="16" fill="url(#panel)" stroke="#2a3a52"/>
  <text x="297" y="390" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">RegService</text>
  <text x="297" y="412" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12">signup</text>

  <rect x="396" y="352" width="150" height="88" rx="16" fill="url(#panel)" stroke="#2a3a52"/>
  <text x="471" y="390" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">UsageService</text>
  <text x="471" y="412" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12">metering</text>

  <rect x="570" y="352" width="150" height="88" rx="16" fill="url(#panel)" stroke="#2a3a52"/>
  <text x="645" y="390" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">MySQL</text>
  <text x="645" y="412" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12">state</text>

  <rect x="744" y="352" width="170" height="88" rx="16" fill="url(#panel)" stroke="#3ef0c8" stroke-opacity="0.45"/>
  <text x="829" y="390" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">WhaleStudio</text>
  <text x="829" y="412" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12">core engine</text>

  <rect x="938" y="352" width="150" height="88" rx="16" fill="url(#panel)" stroke="#2a3a52"/>
  <text x="1013" y="390" text-anchor="middle" fill="#e8eef8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="600">CronJobs</text>
  <text x="1013" y="412" text-anchor="middle" fill="#8492a8" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="12">schedulers</text>

  <text x="48" y="520" fill="#5c6b82" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11">Main path: Customer -&gt; Nginx / ALB -&gt; API -&gt; Reg -&gt; Usage -&gt; MySQL -&gt; WhaleStudio</text>
  <text x="48" y="540" fill="#5c6b82" font-family="PingFang SC, Hiragino Sans GB, Helvetica Neue, Arial, sans-serif" font-size="11">Side effects: CronJobs / WhaleStudio feed UsageService - AWS &amp; Email stay at the edge</text>
</svg>
